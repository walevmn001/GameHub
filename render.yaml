# Cấu hình triển khai Render (Blueprint) cho Mini Game Hub.
#
# Gồm ba thành phần:
#   1. gamehub-walevmn-db   — PostgreSQL (dữ liệu tài khoản, phòng chơi, lịch sử trận).
#   2. gamehub-walevmn-api  — Web Service chạy Express + Socket.IO (thư mục server/).
#   3. gamehub-walevmn      — Static Site phục vụ giao diện React (thư mục dist/).
#
# Cách dùng: đẩy repo lên GitHub rồi tạo "Blueprint" trên Render trỏ vào repo này.
# Sau khi deploy lần đầu, kiểm tra lại VITE_API_URL và ALLOWED_ORIGINS cho khớp tên miền thực tế.

databases:
  - name: gamehub-walevmn-db
    plan: free
    databaseName: minigamehub
    user: minigamehub

services:
  # ---------- Backend: REST API + Socket.IO ----------
  - type: web
    name: gamehub-walevmn-api
    runtime: node
    plan: free
    rootDir: server
    # NODE_ENV=production khiến npm bỏ qua devDependencies, nên buộc cài đầy đủ để có esbuild/tsx/prisma.
    buildCommand: npm install --include=dev && npm run build
    # `prisma db push` chạy lúc runtime (môi trường build không kết nối được DB nội bộ).
    startCommand: npm run prisma:push && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gamehub-walevmn-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: STARTING_COINS
        value: "5000"
      # Bắt buộc khớp đúng tên miền của Static Site bên dưới (đổi nếu bạn đặt tên khác).
      - key: ALLOWED_ORIGINS
        value: https://gamehub-walevmn.onrender.com

  # ---------- Frontend: giao diện React (Vite build) ----------
  - type: web
    name: gamehub-walevmn
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Điền địa chỉ backend (không kèm /api). Đổi nếu tên service API khác.
      - key: VITE_API_URL
        value: https://gamehub-walevmn-api.onrender.com
    # Ứng dụng dùng HashRouter nên chỉ cần trả index.html cho mọi đường dẫn.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
